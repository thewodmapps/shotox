<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Download Shotox logo</title>
<style>body{margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:#0B0B12;color:#fff;font-family:Inter,system-ui,sans-serif;gap:18px}button{background:linear-gradient(90deg,#7C3AED,#EC4899,#F97316);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer}a{color:#fff;opacity:.7;font-size:13px}</style>
</head>
<body>
<h2>Shotox logo</h2>
<canvas id="c" width="1024" height="1024" style="width:240px;height:240px;border-radius:24px;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)"></canvas>
<button id="dl">Download PNG (1024×1024)</button>
<a href="/favicon.svg" download>Or download SVG</a>
<script>
const svg = `<svg width="1024" height="1024" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="zg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse"><stop stop-color="#7C3AED"/><stop offset="0.5" stop-color="#EC4899"/><stop offset="1" stop-color="#F97316"/></linearGradient></defs><rect width="40" height="40" rx="11" fill="url(#zg)"/><path d="M29 12 C 29 9.5, 13 9.5, 13 15 C 13 19, 29 19, 29 23 C 29 28.5, 13 28.5, 13 26" stroke="rgba(255,255,255,0.45)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M28 13 C 28 10.5, 12 10.5, 12 16 C 12 20, 28 20, 28 24 C 28 29.5, 12 29.5, 12 27" stroke="white" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const img = new Image();
const url = URL.createObjectURL(new Blob([svg], {type:'image/svg+xml'}));
img.onload = () => {
  const ctx = document.getElementById('c').getContext('2d');
  ctx.drawImage(img, 0, 0, 1024, 1024);
  URL.revokeObjectURL(url);
};
img.src = url;
document.getElementById('dl').onclick = () => {
  const a = document.createElement('a');
  a.href = document.getElementById('c').toDataURL('image/png');
  a.download = 'shotox-logo-1024.png';
  a.click();
};
</script>
</body>
</html>
